<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Danh sách sân</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- PARTIAL: header -->
  <header class="wf-header"><div class="container"><div class="wf-box" style="height: 44px;">HEADER PARTIAL</div></div></header>
  <!-- END PARTIAL: header -->

  <section class="wf-section" style="padding: 24px 0;">
    <div class="container">
      <div class="wf-box wf-box-dark" style="height: 100px;">BANNER TÌM KIẾM SÂN THỂ THAO</div>
    </div>
  </section>

  <div class="container catalog-layout">
    <!-- SIDEBAR LỌC -->
    <aside class="wf-box" style="height: 460px; align-items: flex-start;">
      SIDEBAR BỘ LỌC<br>(Môn / Khu vực / Giá / Loại sân)
    </aside>

    <!-- LƯỚI DANH SÁCH SÂN 2 CỘT -->
    <main>
      <div class="wf-box" style="height: 44px; margin-bottom: 20px;">THANH SẮP XẾP & SỐ LƯỢNG SÂN</div>
      <div class="grid-2">
        <div class="wf-box" style="height: 250px;">COURT CARD 1</div>
        <div class="wf-box" style="height: 250px;">COURT CARD 2</div>
        <div class="wf-box" style="height: 250px;">COURT CARD 3</div>
        <div class="wf-box" style="height: 250px;">COURT CARD 4</div>
        <div class="wf-box" style="height: 250px;">COURT CARD 5</div>
        <div class="wf-box" style="height: 250px;">COURT CARD 6</div>
      </div>
    </main>
  </div>

  <!-- PARTIAL: footer -->
  <footer class="wf-footer"><div class="container"><div class="wf-box" style="height: 120px;">FOOTER PARTIAL</div></div></footer>
  <!-- END PARTIAL: footer -->
</body>
</html>
