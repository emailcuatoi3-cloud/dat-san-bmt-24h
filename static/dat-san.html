<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Đặt sân</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- PARTIAL: header -->
  <header class="wf-header"><div class="container"><div class="wf-box" style="height: 44px;">HEADER PARTIAL</div></div></header>
  <!-- END PARTIAL: header -->

  <section class="wf-section" style="padding: 24px 0;">
    <div class="container">
      <div class="wf-box wf-box-dark" style="height: 80px; margin-bottom: 16px;">BANNER ĐẶT SÂN THỂ THAO</div>
      <div class="wf-box" style="height: 56px;">THANH TIẾN TRÌNH 5 BƯỚC (1. Chọn sân → 2. Ngày → 3. Giờ → 4. Thông tin → 5. Xác nhận)</div>
    </div>
  </section>

  <div class="container booking-layout">
    <main>
      <div class="grid-2">
        <div class="wf-box" style="height: 90px;">Option Sân 1</div>
        <div class="wf-box" style="height: 90px;">Option Sân 2</div>
        <div class="wf-box" style="height: 90px;">Option Sân 3</div>
        <div class="wf-box" style="height: 90px;">Option Sân 4</div>
        <div class="wf-box" style="height: 90px;">Option Sân 5</div>
        <div class="wf-box" style="height: 90px;">Option Sân 6</div>
      </div>
      <div class="wf-box wf-box-dark" style="height: 48px; margin-top: 20px;">NÚT TIẾP TỤC →</div>
    </main>

    <aside>
      <div class="wf-box" style="height: 220px; margin-bottom: 16px;">TÓM TẮT ĐƠN ĐẶT SÂN</div>
      <div class="wf-box" style="height: 110px;">HỖ TRỢ ĐẶT SÂN NHANH</div>
    </aside>
  </div>

  <!-- PARTIAL: footer -->
  <footer class="wf-footer"><div class="container"><div class="wf-box" style="height: 120px;">FOOTER PARTIAL</div></div></footer>
  <!-- END PARTIAL: footer -->
</body>
</html>
